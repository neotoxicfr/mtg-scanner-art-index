name: Update art-hash index

on:
  schedule:
    - cron: "30 4 * * *" # daily, after Scryfall's bulk regeneration
  workflow_dispatch: {}

permissions:
  contents: write

# Un run manuel (workflow_dispatch) et le cron ne doivent pas se battre sur la
# release `latest` en même temps ; on sérialise sans annuler celui en cours.
concurrency:
  group: art-hash-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Le modèle DINOv2 (~88 Mo) est épinglé par révision dans embed.py et
      # vérifié par SHA-256 au chargement : parfait pour un cache. Sans lui, tout
      # jour avec une nouvelle carte re-téléchargeait 88 Mo depuis HuggingFace.
      # La clé suit embed.py (qui porte MODEL_REVISION) : bumper le modèle
      # invalide le cache tout seul.
      - name: Cache DINOv2 model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dinov2-small.onnx
          key: dinov2-${{ hashFiles('embed.py') }}

      - name: Download previous index
        continue-on-error: true
        run: gh release download latest --repo "$GITHUB_REPOSITORY" --pattern art_hashes.sqlite || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/update index
        id: build
        run: python build_index.py "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.build.outputs.new != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passés par ENV, pas interpolés dans le shell : les sorties du build
          # ne peuvent pas casser (ou injecter) la commande.
          ALGO: ${{ steps.build.outputs.algo }}
          EMBED: ${{ steps.build.outputs.embed }}
          GROUPS: ${{ steps.build.outputs.groups }}
          NEW: ${{ steps.build.outputs.new }}
          BULK: ${{ steps.build.outputs.bulk }}
        run: |
          sha=$(sha256sum art_hashes.sqlite | cut -d' ' -f1)
          title="Art-hash index v${ALGO} — ${GROUPS} groups (${BULK})"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Groups | ${GROUPS} |"
            echo "| New this run | ${NEW} |"
            echo "| Hash algo | v${ALGO} |"
            echo "| Embed version | v${EMBED} |"
            echo "| Scryfall bulk | ${BULK} |"
            echo "| SHA-256 | \`${sha}\` |"
            echo ""
            echo "One 1024-bit hybrid dHash per illustration_id, plus a DINOv2"
            echo "embedding. Verify the asset against the SHA-256 above, and check"
            echo "\`meta.algo_version\` / \`meta.embed_version\` before use — see the"
            echo "README for the exact specification and a consumer example."
          } > notes.md
          # Publication ATOMIQUE : jamais de delete-avant-create (qui laissait
          # les consommateurs SANS release si create échouait ensuite). La
          # release et le tag `latest` persistent ; seul l'asset est remplacé
          # en place via --clobber.
          gh release create latest --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md \
            || gh release edit latest --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md
          gh release upload latest art_hashes.sqlite --repo "$GITHUB_REPOSITORY" --clobber
