name: Update art-hash index

on:
  schedule:
    - cron: "30 4 * * *" # daily, after Scryfall's bulk regeneration
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download previous index
        continue-on-error: true
        run: gh release download latest --repo "$GITHUB_REPOSITORY" --pattern art_hashes.sqlite || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/update index
        id: build
        run: python build_index.py "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.build.outputs.new != '0'
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Groups | ${{ steps.build.outputs.groups }} |"
            echo "| New this run | ${{ steps.build.outputs.new }} |"
            echo "| Hash algo | v${{ steps.build.outputs.algo }} |"
            echo "| Scryfall bulk | ${{ steps.build.outputs.bulk }} |"
            echo ""
            echo "One 1024-bit hybrid dHash per (illustration_id, frame) group."
            echo "Check \`meta.algo_version\` before use — see the README for the"
            echo "exact hash specification and a consumer example."
          } > notes.md
          gh release create latest art_hashes.sqlite \
            --repo "$GITHUB_REPOSITORY" \
            --title "Art-hash index v${{ steps.build.outputs.algo }} — ${{ steps.build.outputs.groups }} groups (${{ steps.build.outputs.bulk }})" \
            --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
