name: Update art-hash index

on:
  schedule:
    - cron: "30 4 * * *" # daily, after Scryfall's bulk regeneration
  workflow_dispatch: {}

permissions:
  contents: write

# Un run manuel (workflow_dispatch) et le cron ne doivent pas se battre sur la
# release `latest` en même temps ; on sérialise sans annuler celui en cours.
concurrency:
  group: art-hash-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Le modèle DINOv2 (~88 Mo) est épinglé par révision dans embed.py et
      # vérifié par SHA-256 au chargement : parfait pour un cache. Sans lui, tout
      # jour avec une nouvelle carte re-téléchargeait 88 Mo depuis HuggingFace.
      # La clé suit embed.py (qui porte MODEL_REVISION) : bumper le modèle
      # invalide le cache tout seul.
      - name: Cache DINOv2 model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: dinov2-small.onnx
          key: dinov2-${{ hashFiles('embed.py') }}

      - name: Download previous index
        continue-on-error: true
        run: gh release download latest --repo "$GITHUB_REPOSITORY" --pattern art_hashes.sqlite || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Compte PUBLIÉ précédent, lu AVANT que build_index.py n'écrase le fichier.
      # C'est le témoin indépendant qui manque au plancher interne (lui dérive du
      # même parse Scryfall, donc un renommage de champ le fait rétrécir avec).
      - name: Record previous index size
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=""
          if [ -f art_hashes.sqlite ]; then
            n=$(sqlite3 art_hashes.sqlite "SELECT value FROM meta WHERE key='groups'" 2>/dev/null || echo "")
          fi
          # A failed download is exactly the case the guard exists for: the
          # build starts from nothing, and a few percent of network errors
          # then publish a truncated index over the good one. The release
          # notes (written below as "| Groups | N |") still carry the
          # published count, so read it from there.
          if [ -z "$n" ]; then
            n=$(gh release view latest --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null \
                | sed -n 's/^| Groups | \([0-9][0-9]*\) |$/\1/p' | head -n 1)
          fi
          echo "groups=$n" >> "$GITHUB_OUTPUT"

      - name: Build/update index
        id: build
        run: python build_index.py "$GITHUB_OUTPUT"

      # Un index qui republie nettement moins de groupes que la dernière release
      # = régression de parse (renommage d'un champ Scryfall), pas une vraie
      # baisse. On refuse d'écraser le bon index ; marge de 2 % pour de vraies
      # suppressions d'illustrations.
      # Sans compte publié connu, un rebuild complet (plus de 1000 nouvelles
      # lignes) n'a aucun témoin : on refuse de publier à l'aveugle plutôt
      # que de laisser passer un index tronqué sous le seul plancher interne
      # de 10 %.
      - name: Guard against a shrunken index
        if: steps.build.outputs.new != '0'
        env:
          PREV: ${{ steps.prev.outputs.groups }}
          NOW: ${{ steps.build.outputs.groups }}
          NEW: ${{ steps.build.outputs.new }}
        run: |
          if [ -z "$PREV" ]; then
            awk -v n="$NEW" 'BEGIN{ if (n+0 > 1000) { printf "ABORT: compte publie inconnu et %d lignes reconstruites, publication a l aveugle refusee\n", n; exit 1 } }' || exit 1
            exit 0
          fi
          awk -v p="$PREV" -v n="$NOW" 'BEGIN{ if (p+0>0 && n+0 < p*0.98) { printf "ABORT: index retreci (%d groupes contre %d publies)\n", n, p; exit 1 } }'

      - name: Publish release
        if: steps.build.outputs.new != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passés par ENV, pas interpolés dans le shell : les sorties du build
          # ne peuvent pas casser (ou injecter) la commande.
          ALGO: ${{ steps.build.outputs.algo }}
          EMBED: ${{ steps.build.outputs.embed }}
          GROUPS: ${{ steps.build.outputs.groups }}
          NEW: ${{ steps.build.outputs.new }}
          BULK: ${{ steps.build.outputs.bulk }}
        run: |
          sha=$(sha256sum art_hashes.sqlite | cut -d' ' -f1)
          title="Art-hash index v${ALGO} — ${GROUPS} groups (${BULK})"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Groups | ${GROUPS} |"
            echo "| New this run | ${NEW} |"
            echo "| Hash algo | v${ALGO} |"
            echo "| Embed version | v${EMBED} |"
            echo "| Scryfall bulk | ${BULK} |"
            echo "| SHA-256 | \`${sha}\` |"
            echo ""
            echo "One 1024-bit hybrid dHash per illustration_id, plus a DINOv2"
            echo "embedding. Verify the asset against the SHA-256 above, and check"
            echo "\`meta.algo_version\` / \`meta.embed_version\` before use — see the"
            echo "README for the exact specification and a consumer example."
          } > notes.md
          # Jamais de delete-avant-create de la release (qui laissait les
          # consommateurs SANS release si create échouait ensuite) : la
          # release et le tag `latest` persistent, seul l'asset change.
          gh release create latest --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md \
            || gh release edit latest --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md
          # Remplacement de l'asset : `--clobber` supprimait l'ancien PUIS
          # envoyait le nouveau — pas d'asset pendant tout l'upload, et
          # jusqu'au lendemain si l'upload échouait. On envoie sous un nom
          # temporaire, puis on permute par renommage : l'ancien reste
          # téléchargeable tant que le nouveau n'est pas entièrement là. Ce
          # n'est pas atomique (deux renommages), mais la fenêtre sans asset
          # se compte en millisecondes, plus en minutes.
          asset_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" \
              --jq ".assets[] | select(.name == \"$1\") | .id"
          }
          for stale in art_hashes.sqlite.new art_hashes.sqlite.bak; do
            id=$(asset_id "$stale")
            if [ -n "$id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            fi
          done
          cp art_hashes.sqlite art_hashes.sqlite.new
          gh release upload latest art_hashes.sqlite.new --repo "$GITHUB_REPOSITORY"
          new_id=$(asset_id art_hashes.sqlite.new)
          old_id=$(asset_id art_hashes.sqlite)
          if [ -n "$old_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$old_id" -f name=art_hashes.sqlite.bak
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new_id" -f name=art_hashes.sqlite
          if [ -n "$old_id" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_id"
          fi
