name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint
        # Le FORMAT aussi : la version de ruff est épinglée pour que le CI dise
        # la même chose que la machine, mais seul `check` tournait ici. Le
        # formateur avait donc dérivé sans que rien ne le signale.
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: python -m pytest tests -q
